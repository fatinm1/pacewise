name: CI
on: [push, pull_request]
jobs:
  extraction-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest google-cloud-bigquery
      - run: python -m pytest tests -q
